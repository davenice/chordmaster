<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241550"/>
      <stop offset="100%" stop-color="#0d0820"/>
    </linearGradient>
    <linearGradient id="wk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8ddff"/>
    </linearGradient>
    <linearGradient id="wk-active" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b97cff"/>
      <stop offset="100%" stop-color="#6a1fd4"/>
    </linearGradient>
    <linearGradient id="bk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1040"/>
      <stop offset="100%" stop-color="#080612"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>

  <!-- White keys -->
  <rect x="39"  y="140" width="60" height="240" rx="8" fill="url(#wk)"/>
  <rect x="101" y="140" width="60" height="240" rx="8" fill="url(#wk)"/>
  <rect x="163" y="140" width="60" height="240" rx="8" fill="url(#wk)"/>
  <rect x="225" y="140" width="60" height="240" rx="8" fill="url(#wk)"/>
  <rect x="287" y="140" width="60" height="240" rx="8" fill="url(#wk-active)"/>
  <rect x="349" y="140" width="60" height="240" rx="8" fill="url(#wk)"/>
  <rect x="411" y="140" width="60" height="240" rx="8" fill="url(#wk)"/>

  <!-- Purple glow behind active key -->
  <rect x="287" y="140" width="60" height="240" rx="8" fill="#863bff" opacity="0.3" filter="url(#glow)"/>

  <!-- Black keys -->
  <rect x="81"  y="140" width="40" height="152" rx="5" fill="url(#bk)"/>
  <rect x="143" y="140" width="40" height="152" rx="5" fill="url(#bk)"/>
  <rect x="267" y="140" width="40" height="152" rx="5" fill="url(#bk)"/>
  <rect x="329" y="140" width="40" height="152" rx="5" fill="url(#bk)"/>
  <rect x="391" y="140" width="40" height="152" rx="5" fill="url(#bk)"/>

  <!-- Black key sheen -->
  <rect x="84"  y="143" width="20" height="60" rx="3" fill="#ffffff" opacity="0.06"/>
  <rect x="146" y="143" width="20" height="60" rx="3" fill="#ffffff" opacity="0.06"/>
  <rect x="270" y="143" width="20" height="60" rx="3" fill="#ffffff" opacity="0.06"/>
  <rect x="332" y="143" width="20" height="60" rx="3" fill="#ffffff" opacity="0.06"/>
  <rect x="394" y="143" width="20" height="60" rx="3" fill="#ffffff" opacity="0.06"/>
</svg>
